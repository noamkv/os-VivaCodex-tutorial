<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מערכת הבחינות בעל פה - קורס מערכות הפעלה</title>
    <meta name="description" content="פורטל למידע ושיבוץ למערכת הבחינות בעל פה בקורס מערכות הפעלה.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .group-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            width: 100%;
        }

        @media (max-width: 560px) {
            .group-grid {
                grid-template-columns: 1fr;
            }
        }

        .group-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.75rem;
            padding: 2rem 1.5rem;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.04);
            text-decoration: none;
            color: #f8fafc;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .group-card::before {
            content: '';
            position: absolute;
            inset: 0;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        .group-card-a::before {
            background: radial-gradient(circle at center, rgba(59, 130, 246, 0.15) 0%, transparent 70%);
        }

        .group-card-b::before {
            background: radial-gradient(circle at center, rgba(168, 85, 247, 0.15) 0%, transparent 70%);
        }

        .group-card:hover {
            transform: translateY(-4px);
            border-color: rgba(255, 255, 255, 0.18);
        }

        .group-card:hover::before {
            opacity: 1;
        }

        .group-card-a:hover {
            box-shadow: 0 12px 30px rgba(59, 130, 246, 0.3);
        }

        .group-card-b:hover {
            box-shadow: 0 12px 30px rgba(168, 85, 247, 0.3);
        }

        .group-badge {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.03em;
        }

        .group-card-a .group-badge {
            background: linear-gradient(135deg, #2563eb, #38bdf8);
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.5);
        }

        .group-card-b .group-badge {
            background: linear-gradient(135deg, #7c3aed, #c084fc);
            box-shadow: 0 4px 15px rgba(124, 58, 237, 0.5);
        }

        .group-card-title {
            font-size: 1.3rem;
            font-weight: 600;
        }

        .group-card-sub {
            font-size: 0.9rem;
            color: #94a3b8;
            text-align: center;
        }

        .arrow-icon {
            margin-top: 0.25rem;
            opacity: 0.5;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        .group-card:hover .arrow-icon {
            transform: translateX(-6px);
            opacity: 1;
        }

        .divider {
            width: 100%;
            border: none;
            border-top: 1px solid rgba(255, 255, 255, 0.07);
        }

        .hint {
            color: #64748b;
            font-size: 0.9rem;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="container" id="main-container">

        <header class="header">
            <h1>מערכת הבחינות - מערכות הפעלה</h1>
            <p>בחרו את הקבוצה שלכם כדי להמשיך לשלבי ההרשמה לבחינה</p>
        </header>

        <hr class="divider">

        <div class="group-grid" id="group-selection">
            <a href="group-a/index.html" class="group-card group-card-a" id="btn-group-a">
                <div class="group-badge">א</div>
                <span class="group-card-title">קבוצה א</span>
                <span class="group-card-sub">קבוצת בדיקה אוטומטית</span>
                <svg class="arrow-icon" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
            </a>

            <a href="group-b/index.html" class="group-card group-card-b" id="btn-group-b">
                <div class="group-badge">ב</div>
                <span class="group-card-title">קבוצה ב</span>
                <span class="group-card-sub">קבוצת AI</span>
                <svg class="arrow-icon" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
            </a>
        </div>

        <p class="hint">לחצו על הקבוצה שאתם משויכים אליה בסדר הפרויקטים</p>

    </div>
</body>

</html>
