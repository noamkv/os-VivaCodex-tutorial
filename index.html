<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מערכת הבחינות בעל פה - קורס מערכות הפעלה</title>
    <meta name="description" content="פורטל למידע ושיבוץ למערכת הבחינות בעל פה בקורס מערכות הפעלה.">

    <!-- פונטים -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* משתני צבע ועיצוב */
        :root {
            --bg-body: #0f172a;
            /* רקע כהה עמוק */
            --bg-container: #1e293b;
            /* כרטיסייה מרכזית */
            --bg-card: #0f172a;
            /* רקע פנימי לכרטיסיות */
            --text-main: #f8fafc;
            /* טקסט לבן/אפור בהיר */
            --text-muted: #94a3b8;
            /* טקסט משני */
            --primary: #3b82f6;
            /* כחול לכפתורים */
            --primary-hover: #2563eb;
            --accent: #f8fafc;
            /* כתום/צהוב לכותרות שלבים */
            --border: #334155;
            /* גבולות עדינים */
        }

        /* איפוס בסיסי */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            line-height: 1.6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem 1rem;
        }

        /* המכל הראשי */
        .container {
            background-color: var(--bg-container);
            max-width: 1000px;
            width: 100%;
            border-radius: 16px;
            padding: 2.5rem 2rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
        }

        /* אזור כותרת */
        .header {
            text-align: center;
            margin-bottom: 2.5rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--border);
        }

        .header h1 {
            font-size: 2rem;
            color: #ffffff;
            margin-bottom: 0.5rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 1.05rem;
        }

        /* כותרות שלבים */
        .step-title {
            color: var(--accent);
            font-size: 1.25rem;
            font-weight: 600;
            text-align: center;
            margin-bottom: 1rem;
        }

        /* אזור הוידאו */
        .video-wrapper {
            margin-bottom: 2.5rem;
        }

        #video-placeholder {
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border);
        }

        /* כרטיסיות שלבים */
        .step-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            text-align: center;
            transition: transform 0.2s ease;
        }

        .step-card:last-child {
            margin-bottom: 0;
        }

        .step-desc {
            font-size: 1.1rem;
            font-weight: 500;
            margin-bottom: 1.25rem;
            transition: color 0.3s ease;
        }

        /* כפתורים */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            background-color: var(--primary);
            color: #ffffff;
            text-decoration: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.3);
        }

        .btn:hover:not(.disabled) {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 10px -1px rgba(59, 130, 246, 0.4);
        }

        .btn svg {
            flex-shrink: 0;
        }

        /* עיצוב לכפתור חסום */
        .btn.disabled {
            background-color: var(--border);
            color: #64748b;
            pointer-events: none;
            box-shadow: none;
            opacity: 0.7;
        }

        /* תיבת מידע (Notice) */
        .info-box {
            display: flex;
            align-items: flex-start;
            gap: 1rem;
            background: rgba(51, 65, 85, 0.4);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem 1.25rem;
            text-align: right;
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .info-box svg {
            color: var(--primary);
            margin-top: 0.1rem;
        }

        /* התאמה למסכים קטנים */
        @media (max-width: 600px) {
            .container {
                padding: 1.5rem 1rem;
            }

            .header h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>

<body>
    <div class="container" id="main-container">

        <!-- כותרת ראשית -->
        <header class="header">
            <h1>מערכת VivaCodex - מערכות הפעלה</h1>
            <p>כאן תוכלו למצוא הסבר על מערכת הבדיקה.<br>שימו לב: בכדי להיבדק, עליכם להשתבץ דרך הלינק למטה.</p>
        </header>

        <!-- שלב 1: וידאו -->
        <div class="video-wrapper">
            <h2 class="step-title">שלב 1: צפו בסרטון ההסבר</h2>
            <div id="video-placeholder" aria-label="Video Placeholder">
                <!-- הסרטון יוזרק לכאן דרך JavaScript -->
            </div>
        </div>

        <!-- שלב 2: שאלון -->
        <div class="step-card" id="step-1-container">
            <p class="step-desc" id="step-2-desc">שלב 2: מלאו את השאלון</p>
            <a id="form-link"
                href="https://docs.google.com/forms/d/e/1FAIpQLScqNBi3GOOrFR-5A0wvA2tH4fS-fspmDX409Q-FJos3djLIrA/viewform?usp=dialog"
                target="_blank" rel="noopener noreferrer" class="btn disabled">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                    <line x1="16" y1="13" x2="8" y2="13"></line>
                    <line x1="16" y1="17" x2="8" y2="17"></line>
                    <polyline points="10 9 9 9 8 9"></polyline>
                </svg>
                <span>שאלון</span>
            </a>
        </div>

        <!-- שלב 3: שיבוץ ביומן -->
        <div class="step-card" id="step-2-container">
            <p class="step-desc" style="color: var(--text-main);">שלב 3: קביעת מועד</p>
            <div class="info-box">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                    <line x1="16" y1="2" x2="16" y2="6"></line>
                    <line x1="8" y1="2" x2="8" y2="6"></line>
                    <line x1="3" y1="10" x2="21" y2="10"></line>
                </svg>
                <span>לאחר מילוי השאלון תקבלו בתגובה את הקישור לקביעת מועד המבדק ביומן. <strong>נא להשתבץ פעם אחת
                        בלבד.</strong></span>
            </div>
        </div>

    </div>

    <!-- סקריפטים -->
    <script>
        // ── YouTube video ID ──
        const YOUTUBE_VIDEO_ID = 'QHV6KNJcx2s';

        // ── Embed YouTube video ──
        const videoSlot = document.getElementById('video-placeholder');
        if (YOUTUBE_VIDEO_ID) {
            videoSlot.innerHTML = `
                <iframe width="100%" height="100%"
                    src="https://www.youtube.com/embed/${YOUTUBE_VIDEO_ID}"
                    title="YouTube video player" frameborder="0"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                    allowfullscreen>
                </iframe>`;
        } else {
            videoSlot.style.display = 'flex';
            videoSlot.style.alignItems = 'center';
            videoSlot.style.justifyContent = 'center';
            videoSlot.style.color = '#94a3b8';
            videoSlot.innerHTML = '<p>סרטון ההסבר יעלה בקרוב...</p>';
        }

        // ── מנגנון נעילת כפתור לשלב 2 ──
        document.addEventListener('DOMContentLoaded', () => {
            const step2Desc = document.getElementById('step-2-desc');
            const formBtn = document.getElementById('form-link');

            const originalText = "שלב 2: מלאו את השאלון";
            let timeLeft = 10; // שניות

            // הגדרת מצב התחלתי - נעול
            step2Desc.innerHTML = `🔒 נא לצפות בסרטון תחילה 🔒`;
            step2Desc.style.color = '#f59e0b'; // צבע כתום/צהוב בולט להדגשה

            const countdownInterval = setInterval(() => {
                timeLeft--;
                if (timeLeft > 0) {
                    step2Desc.innerHTML = `🔒 נא לצפות בסרטון תחילה 🔒`;
                } else {
                    // שחרור הנעילה בסיום הספירה
                    clearInterval(countdownInterval);
                    step2Desc.innerHTML = originalText;
                    step2Desc.style.color = ''; // החזרה לצבע המקורי
                    formBtn.classList.remove('disabled');
                }
            }, 1000); // כל 1000 מילישניות (1 שנייה)
        });
    </script>
</body>

</html>
